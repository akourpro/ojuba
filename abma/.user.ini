; النظير المتوافق مع استضافات PHP-FPM/CGI/LiteSpeed لتوجيهَي php_value
; auto_prepend_file/auto_append_file بملف abma/.htaccess (المجاور) — تُقرأ
; بواسطة PHP نفسه بغضّ النظر عن SAPI/وحدة أباتشي المُستخدَمة، فتعمل حتى على
; الاستضافات التي تتجاهل كتلة <IfModule mod_php.c> بـ.htaccess (لا تحمل وحدة
; بهذا الاسم رغم دعمها الفعلي لـPHP). لا حاجة لتكرار open_basedir/include_path
; هنا — تُورَث تلقائياً من .user.ini بجذر الموقع (PHP يجمع إعدادات كل ملفات
; .user.ini من جذر الموقع نزولاً حتى مجلد السكربت المُنفَّذ، والأعمق يطغى فقط
; على نفس المفتاح). معالج التثبيت (install/) ونظام التحديث (includes/updater.php)
; يحدّثان هذا الملف تلقائياً بالمسار الحقيقي — لا تعدّله يدوياً.
auto_prepend_file=/Applications/XAMPP/htdocs/ojuba/abma/autoload.php
auto_append_file=/Applications/XAMPP/htdocs/ojuba/abma/footer.php

; نفس منطق حدود رفع الملفات بـabma/.htaccess (استيراد قوالب ZIP حتى 20 م.ب) —
; مكرَّرة هنا لنفس سبب auto_prepend_file أعلاه: على الاستضافات التي تتجاهل
; كتلة <IfModule> بـ.htaccess، هذان السطران هما الضمانة الوحيدة لرفع تلك الحدود.
upload_max_filesize=25M
post_max_size=30M
