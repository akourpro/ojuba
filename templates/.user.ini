; احتياطي لـ templates/.htaccess (php_flag engine off) على استضافات لا تُطبِّق
; php_flag عبر .htaccess إطلاقاً (PHP-FPM/CGI/LiteSpeed وما شابه، حيث .user.ini
; هو المتحكم الفعلي). "engine" هي PHP_INI_ALL فتعمل عبر .user.ini بنفس آلية
; التسلسل الهرمي بالمجلدات — تعطّل محرّك PHP لأي ملف .php ينتهي به المطاف هنا
; بالخطأ (رفع قالب غير موثوق مثلاً)، مطابقة لطبقة الحماية الأولى بـ.htaccess.
; الطبقتان الأخريان (RemoveHandler/RemoveType وFilesMatch+Deny) خاصتان بـ
; Apache فقط ولا يوجد لهما مكافئ عبر .user.ini، لكن تبقيان فعّالتين إن كان
; .htaccess نفسه مدعوماً على تلك الاستضافة.
engine=Off
